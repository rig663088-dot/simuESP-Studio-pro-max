name: Build Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "SimuESP-Studio-PRO-MAX/**"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: SimuESP-Studio-PRO-MAX

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Crear instalador
        run: npm run build:windows

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: SimuESP-Windows
          path: |
            SimuESP-Studio-PRO-MAX/dist/*.exe
            SimuESP-Studio-PRO-MAX/dist/*.zip
          if-no-files-found: error
